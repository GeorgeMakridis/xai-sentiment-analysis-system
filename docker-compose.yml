services:
  # ── RustFS (S3-compatible object storage) ───────────────────────
  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs-server
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    environment:
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${RESTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RESTFS_SECRET_KEY:-rustfsadmin}
    volumes:
      - rustfs_data:/data
    command: ["/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network

  # ── Keycloak (OIDC auth) ───────────────────────────────────────
  keycloak-db:
    image: postgres:15-alpine
    container_name: keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:-keycloak}
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - app-network
    profiles:
      - keycloak                # only starts with --profile keycloak

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    command: start-dev
    ports:
      - "8080:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-keycloak}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KEYCLOAK_ADMIN: ${KC_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && cat <&3 | grep -q 'UP'"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - app-network
    profiles:
      - keycloak                # only starts with --profile keycloak

  # ── Dashboard ───────────────────────────────────────────────────
  dashboard:
    build: ./dashboard
    ports:
      - "3001:3000"
    volumes:
      - ./shared_volume:/app/shared_data
      - ./auth:/app/auth:ro        # shared auth module
    depends_on:
      - xai_service
      - ai_outputs
      - rustfs
    environment:
      - XAI_SERVICE_URL=${XAI_SERVICE_URL:-http://xai_service:8000}
      - AI_OUTPUTS_SERVICE_URL=${AI_OUTPUTS_SERVICE_URL:-http://ai_outputs:8001}
      - RESTFS_ENDPOINT=${RESTFS_ENDPOINT:-rustfs:9000}
      - RESTFS_ACCESS_KEY=${RESTFS_ACCESS_KEY:-rustfsadmin}
      - RESTFS_SECRET_KEY=${RESTFS_SECRET_KEY:-rustfsadmin}
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-change-me-in-production}
      # Auth — set AUTH_MODE=keycloak to enable OIDC
      - AUTH_MODE=${AUTH_MODE:-legacy}
      - KC_SERVER_URL=${KC_SERVER_URL:-http://keycloak:8080}
      - KC_EXTERNAL_URL=${KC_EXTERNAL_URL:-http://localhost:8080}
      - KC_REALM=${KC_REALM:-xai-platform}
      - KC_CLIENT_ID=${KC_CLIENT_ID:-xai-dashboard}
      - KC_CLIENT_SECRET=${KC_CLIENT_SECRET:-}
      - LEGACY_ADMIN_PW=${LEGACY_ADMIN_PW:-changeme}
      - LEGACY_ANALYST_PW=${LEGACY_ANALYST_PW:-changeme}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-network

  # ── XAI Service ─────────────────────────────────────────────────
  xai_service:
    build: ./xai_service
    ports:
      - "8000:8000"
    volumes:
      - ./shared_volume:/app/shared_data
      - ./auth:/app/auth:ro
    depends_on:
      - rustfs
    environment:
      - AI_OUTPUTS_SERVICE_URL=${AI_OUTPUTS_SERVICE_URL:-http://ai_outputs:8001}
      - AI_ADAPTER_URL=${AI_ADAPTER_URL:-}
      - AI_ADAPTER_TIMEOUT=${AI_ADAPTER_TIMEOUT:-60}
      - RESTFS_ENDPOINT=${RESTFS_ENDPOINT:-rustfs:9000}
      - RESTFS_ACCESS_KEY=${RESTFS_ACCESS_KEY:-rustfsadmin}
      - RESTFS_SECRET_KEY=${RESTFS_SECRET_KEY:-rustfsadmin}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - AUTH_MODE=${AUTH_MODE:-legacy}
      - KC_SERVER_URL=${KC_SERVER_URL:-http://keycloak:8080}
      - KC_REALM=${KC_REALM:-xai-platform}
      - KC_CLIENT_ID=${KC_CLIENT_ID:-xai-dashboard}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-network

  # ── AI Outputs (RAG + Chat) ────────────────────────────────────
  ai_outputs:
    build: ./ai_outputs
    ports:
      - "8002:8001"
    volumes:
      - ./shared_volume:/app/shared_data
      - ./auth:/app/auth:ro
    depends_on:
      - rustfs
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - RESTFS_ENDPOINT=${RESTFS_ENDPOINT:-rustfs:9000}
      - RESTFS_ACCESS_KEY=${RESTFS_ACCESS_KEY:-rustfsadmin}
      - RESTFS_SECRET_KEY=${RESTFS_SECRET_KEY:-rustfsadmin}
      - AUTH_MODE=${AUTH_MODE:-legacy}
      - KC_SERVER_URL=${KC_SERVER_URL:-http://keycloak:8080}
      - KC_REALM=${KC_REALM:-xai-platform}
      - KC_CLIENT_ID=${KC_CLIENT_ID:-xai-dashboard}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-10485760}
      - REQUEST_TIMEOUT=${REQUEST_TIMEOUT:-30}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-network

volumes:
  rustfs_data:
  keycloak_db_data:

networks:
  app-network:
    driver: bridge
